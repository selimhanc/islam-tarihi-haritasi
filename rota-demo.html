<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Routes</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef2f5;
  font-family: Arial, sans-serif;
}

.map {
  position: relative;
  width: 100%;
  max-width: 1100px;
  height: 650px;
  margin: 30px auto;
  overflow: hidden;
  border-radius: 16px;
  background:
    linear-gradient(25deg, transparent 48%, #d5dbe0 49%, #d5dbe0 51%, transparent 52%),
    linear-gradient(-18deg, transparent 48%, #d5dbe0 49%, #d5dbe0 51%, transparent 52%),
    #f4f6f7;
  background-size: 180px 150px;
}

/* sahte harita yolları */
.street {
  position: absolute;
  background: rgba(255,255,255,.8);
  border: 1px solid #d9dee2;
}

.s1 {
  width: 130%;
  height: 28px;
  left: -15%;
  top: 20%;
  transform: rotate(-10deg);
}

.s2 {
  width: 130%;
  height: 22px;
  left: -15%;
  top: 52%;
  transform: rotate(8deg);
}

.s3 {
  width: 120%;
  height: 24px;
  left: -10%;
  top: 76%;
  transform: rotate(-16deg);
}

.s4 {
  width: 24px;
  height: 120%;
  left: 25%;
  top: -10%;
  transform: rotate(14deg);
}

.s5 {
  width: 20px;
  height: 120%;
  left: 67%;
  top: -10%;
  transform: rotate(-8deg);
}

svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

/* rota */
.route {
  fill: none;
  stroke: #1976d2;
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;

  /*
    Dash pattern korunuyor.
    Başlangıçta tüm rota gizli.
  */
  stroke-dasharray: 17 12;
}

/* hareket eden point */
.focus {
  fill: white;
  stroke: #1976d2;
  stroke-width: 5;
  filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
}

/* point dışındaki küçük halka */
.focus-ring {
  fill: none;
  stroke: rgba(25,118,210,.25);
  stroke-width: 3;
}

/* timeline */
.timeline {
  position: absolute;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%);
  display: flex;
  gap: 12px;
  padding: 10px 16px;
  background: rgba(255,255,255,.92);
  border-radius: 30px;
  box-shadow: 0 4px 18px rgba(0,0,0,.12);
}

.step {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  color: #777;
  background: #e6e9ec;
  transition: .3s;
}

.step.active {
  color: white;
  background: #1976d2;
  transform: scale(1.15);
}

.step.done {
  color: white;
  background: #1976d2;
}
</style>
</head>

<body>

<div class="map">

  <div class="street s1"></div>
  <div class="street s2"></div>
  <div class="street s3"></div>
  <div class="street s4"></div>
  <div class="street s5"></div>

  <svg viewBox="0 0 1000 600">

    <defs>
      <!--
        Mask:
        Beyaz olan bölüm görünür,
        siyah olan bölüm gizlidir.
      -->
      <mask
        id="routeMask"
        maskUnits="userSpaceOnUse"
        x="0"
        y="0"
        width="1000"
        height="600"
      >
        <rect
          x="0"
          y="0"
          width="1000"
          height="600"
          fill="black"
        />

        <path
          id="drawMask"
          fill="none"
          stroke="white"
          stroke-width="18"
          stroke-linecap="round"
        />
      </mask>
    </defs>

    <!-- ROUTES -->

    <path
      id="route1"
      class="route"
      d="
        M 90 462
        C 125 400, 145 510, 190 420
        C 225 350, 225 365, 270 336
      "
      mask="url(#routeMask)"
    />

    <path
      id="route2"
      class="route"
      d="
        M 270 336
        C 305 270, 325 390, 365 345
        C 395 310, 410 470, 450 432
      "
      mask="url(#routeMask)"
    />

    <path
      id="route3"
      class="route"
      d="
        M 450 432
        C 485 350, 500 480, 535 370
        C 565 275, 590 300, 630 228
      "
      mask="url(#routeMask)"
    />

    <path
      id="route4"
      class="route"
      d="
        M 630 228
        C 665 170, 690 290, 720 245
        C 755 190, 770 360, 800 324
      "
      mask="url(#routeMask)"
    />

    <path
      id="route5"
      class="route"
      d="
        M 800 324
        C 830 270, 845 360, 865 250
        C 885 175, 895 160, 910 108
      "
      mask="url(#routeMask)"
    />

    <!-- hareket eden point -->
    <circle id="ring" class="focus-ring" r="13"></circle>
    <circle id="focus" class="focus" r="7"></circle>

  </svg>

  <div class="timeline">
    <div class="step active">1</div>
    <div class="step">2</div>
    <div class="step">3</div>
    <div class="step">4</div>
    <div class="step">5</div>
  </div>

</div>

<script>

const routes = [
  document.getElementById("route1"),
  document.getElementById("route2"),
  document.getElementById("route3"),
  document.getElementById("route4"),
  document.getElementById("route5")
];

const reveals = [
  document.getElementById("reveal1"),
  document.getElementById("reveal2"),
  document.getElementById("reveal3"),
  document.getElementById("reveal4"),
  document.getElementById("reveal5")
];

const focus = document.getElementById("focus");
const ring = document.getElementById("ring");

const steps = document.querySelectorAll(".step");

const ROUTE_DURATION = 2600;
const PAUSE_BETWEEN = 200;


function smoothStep(t) {
  return t * t * (3 - 2 * t);
}


function animateRoute(index) {

  return new Promise(resolve => {

    const route = routes[index];
    const reveal = reveals[index];

    const length = route.getTotalLength();

    /*
      Bu mask sadece BU rotaya ait.
      Önceki rotaların maskesine dokunmuyoruz.
    */
    reveal.setAttribute(
      "d",
      route.getAttribute("d")
    );

    /*
      Başlangıçta bu rota tamamen gizli.
    */
    reveal.style.strokeDasharray =
      `0 ${length}`;


    const startTime = performance.now();


    function frame(now) {

      let progress =
        (now - startTime) / ROUTE_DURATION;

      progress = Math.min(progress, 1);

      const eased = smoothStep(progress);

      const distance =
        length * eased;


      /*
        SADECE aktif rotanın
        0 -> distance kısmını göster.
      */
      reveal.style.strokeDasharray =
        `${distance} ${length}`;


      /*
        Point'i aktif rotada ilerlet.
      */
      const point =
        route.getPointAtLength(distance);

      focus.setAttribute(
        "cx",
        point.x
      );

      focus.setAttribute(
        "cy",
        point.y
      );

      ring.setAttribute(
        "cx",
        point.x
      );

      ring.setAttribute(
        "cy",
        point.y
      );


      if (progress < 1) {

        requestAnimationFrame(frame);

      } else {

        /*
          ROTA TAMAMLANDI.

          Maskeyi tamamen açık bırakıyoruz.
          Böylece rota artık kaybolmayacak.
        */
        reveal.style.strokeDasharray =
          `${length} ${length}`;

        resolve();
      }
    }


    requestAnimationFrame(frame);
  });
}


function setStep(index) {

  steps.forEach((step, i) => {

    step.classList.remove("active");

    if (i < index) {
      step.classList.add("done");
    }

    if (i === index) {
      step.classList.add("active");
    }

  });
}


async function startRoutes() {

  /*
    İlk başlangıçta bütün rotaları gizle.
  */
  reveals.forEach((reveal, index) => {

    const length =
      routes[index].getTotalLength();

    reveal.style.strokeDasharray =
      `0 ${length}`;

  });


  /*
    Rotaları sırayla çalıştır.
  */
  for (let i = 0; i < routes.length; i++) {

    setStep(i);

    await animateRoute(i);

    await new Promise(resolve =>
      setTimeout(resolve, PAUSE_BETWEEN)
    );
  }

  /*
    Son noktada kal.
    İstersen burada tekrar başlatabiliriz.
  */
}

startRoutes();

</script>

</body>
</html>
